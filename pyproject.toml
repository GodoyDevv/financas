[project]
name = "financas"
version = "0.1.0"
description = "Atlas Finanças - Gestão orçamentária doméstica com IA multimodal"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.13.3",
    "fastapi==0.115.0",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "psycopg[binary]>=3.1.18",
    "pydantic==2.8.2",
    "pydantic-settings>=2.16.1",
    "python-dateutil==2.9.0.post0",
    "python-multipart==0.0.9",
    "sentry-sdk[fastapi]>=2.8.0",
    "sqlalchemy==2.0.35",
    "tzdata>=2024.2; sys_platform == 'win32'",
    "uvicorn[standard]==0.30.6",
]

[dependency-groups]
dev = [
    "mypy==1.11.2",
    "pre-commit==3.8.0",
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
    "types-python-dateutil>=2.9.0.20241001",
    "uv>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = [
    "E501",  # line-length tratado prioritariamente pelo ruff format
    "B008",  # FastAPI pattern padrão para injeção de dependências via Depends()
    "UP038", # Uso de isinstance(x, (A, B)) é mais legível e idiomático que isinstance(x, A | B)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # asserts permitidos em suíte de testes
    "S105",  # credenciais falsas de teste
    "S106",  # senhas em fixtures e mocks
    "S603",  # execução de subprocess nos testes de migração e sync
    "E402",  # configuração de variáveis de ambiente de teste antes de importar main
    "SIM115", # NamedTemporaryFile fechado manualmente para SQLite temp DB
]
"scripts/*" = [
    "E402",  # sys.path manipulado antes dos imports de backend
    "S608",  # script local de backup / dump
]
"migrations/*" = [
    "S110",  # try-except-pass em migrações idempotentes de tabelas/constraints
    "B007",  # loop variables em scripts de backfill
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
ignore_missing_imports = true
explicit_package_bases = true
files = [
    "backend/auth.py",
    "backend/nlp.py",
    "backend/observability.py",
    "backend/services",
]

[[tool.mypy.overrides]]
module = [
    "backend.auth",
    "backend.nlp",
    "backend.observability",
    "backend.services.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --cov=backend --cov-fail-under=71"
markers = [
    "e2e: end-to-end integration tests",
    "slow: tests that take longer to run",
]
