services:
  - type: web
    name: fintrack-intelligence
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: SESSION_TTL_HOURS
        sync: false
      - key: DEV_INSECURE_COOKIES
        value: "0"
