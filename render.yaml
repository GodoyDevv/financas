services:
  - type: web
    name: fintrack-intelligence
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: ENV
        value: production
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: SESSION_TTL_HOURS
        sync: false
      - key: DEV_INSECURE_COOKIES
        value: "0"
      - key: WEBHOOK_SECRET
        sync: false
      - key: WEBHOOK_SECRET_HEADER
        value: "X-Webhook-Secret"
      - key: WEBHOOK_ALLOW_PATH_TOKEN
        value: "0"
      - key: WHATSAPP_GROUP_JID
        sync: false
      - key: LOG_LEVEL
        value: "INFO"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.0"
