name: Trigger Scheduler Tick

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'URL base da aplicação no Render (ex: https://fintrack.onrender.com)'
        required: true
        type: string

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /internal/jobs/tick
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          APP_URL: ${{ inputs.app_url }}
        run: |
          curl -f -X POST "${APP_URL}/internal/jobs/tick" \
            -H "X-Admin-Token: ${ADMIN_TOKEN}" \
            -H "Content-Type: application/json"
